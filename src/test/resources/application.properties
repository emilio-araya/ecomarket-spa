# Los tests no deben depender de una base MariaDB local: sin esto, el contexto
# de Spring no levanta en una máquina limpia y `mvn test` falla por
# infraestructura, no por el código.
#
# En CI el workflow define DB_URL, DB_USERNAME y DB_PASSWORD, así que la suite
# sigue corriendo contra MariaDB real; en local cae a H2 en memoria.
spring.datasource.url=${DB_URL:jdbc:h2:mem:ecomarket;MODE=MariaDB;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:create-drop}
spring.jpa.show-sql=false
